name = "hollowdeep-metrics"
main = "worker.js"
compatibility_date = "2026-08-01"

# Fill database_id in with what `wrangler d1 create hollowdeep-metrics` prints.
[[d1_databases]]
binding = "DB"
database_name = "hollowdeep-metrics"
database_id = ""

[vars]
# Comma separated list of sites allowed to post. Leave it empty while testing
# and set it to the published address once the game is live, for example
# "https://ozietra.github.io".
ALLOWED_ORIGINS = ""

# PANEL_TOKEN is a secret, never a var:
#   wrangler secret put PANEL_TOKEN
